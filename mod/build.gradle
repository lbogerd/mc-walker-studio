plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Create, Sable and Aeronautics are pulled as their released jars from Modrinth's maven.
    // These jars nest their own libraries (Flywheel, Ponder, Registrate, Veil, Rapier, Simulated, Offroad, ...).
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Create's own maven: compile-only copies of libraries Create nests in its jar (Ponder, Flywheel).
    exclusiveContent {
        forRepository { maven { name = 'CreateMod'; url = 'https://maven.createmod.net' } }
        filter { includeGroup 'net.createmod.ponder'; includeGroup 'dev.engine-room.flywheel' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Registrate'; url = 'https://maven.ithundxr.dev/snapshots' } }
        filter { includeGroup 'com.tterrag.registrate' }
    }
    // JUnit for the plain-Java unit tests (src/test)
    mavenCentral()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('src/generated/**/.cache')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        // Needs a GPU/display. Not used on the dev box yet; run it on a machine with graphics.
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Headless dedicated server (run/server). Connect from any client at localhost:25565.
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Headless: boots a server, runs every @GameTest in our namespace, exits non-zero on failure.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    // Release jars we only unpack nested jars from (see extractNestedJars).
    nestedJarSources {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

// Aeronautics ships as a bundle whose real code (Simulated, Aeronautics, Offroad) lives in nested
// META-INF/jarjar/*.jar files, and Sable nests its math API (sable-companion) and Veil the same way.
// javac can't see inside nested jars, so unpack them for compileOnly use. At runtime NeoForge loads the
// outer jars itself.
def archives = services.get(ArchiveOperations)
def extractNestedJars = tasks.register('extractNestedJars', Sync) {
    from(configurations.nestedJarSources.elements.map { files -> files.collect { archives.zipTree(it.asFile) } }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { it.path = it.name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('nested-jars')
}

dependencies {
    implementation "maven.modrinth:create:${create_version}"
    implementation "maven.modrinth:sable:${sable_version}"
    runtimeOnly "maven.modrinth:create-aeronautics:${aeronautics_version}"
    nestedJarSources "maven.modrinth:create-aeronautics:${aeronautics_version}"
    nestedJarSources "maven.modrinth:sable:${sable_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly files(extractNestedJars.map { it.destinationDir }).builtBy(extractNestedJars).asFileTree.matching { include '*.jar' }

    // Unit tests run on the plain JVM, without Minecraft: they cover com.lbogerd.walkers.sim (the port of the
    // studio's src/sim), which may only use the JDK and Gson. Gson comes with Minecraft on the main classpath;
    // the test classpath gets the same version explicitly.
    testImplementation platform('org.junit:junit-bom:5.12.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

// ./gradlew test: JUnit 5, headless. The walking-loop port is checked against fixtures exported from the
// studio (npm run fixtures → src/test/resources/sim-fixtures).
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

// Game tests must start from a fresh world: Sable saves sub-levels with it, and since our tests run near
// the origin (see GameTestServerMixin), hulls left over from earlier runs would collide with new ones.
def cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete layout.projectDirectory.dir('run/gametest/world')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn cleanGameTestWorld }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
