modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Build-your-own walkers for Create: Aeronautics, on top of Sable sub-levels.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    versionRange="[2.0.6,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="aeronautics"
    type="required"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
